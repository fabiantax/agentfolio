  qwen_chat_timeout_seconds: 180
  qwen_chat_max_tokens: 6144

train:
  skill_path: /home/fabian/.hermes/skills/software-development/csharp-solid-coupling/SKILL.md
  num_epochs: 2
  skill_init: |
    You are optimizing a skill document that guides agents writing and
    reviewing C# with SOLID/DRY/KISS and loose-coupling rules.
    Failure modes observed with the unoptimized skill:
