name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # k8s lane: ci-k8s runner executes jobs as PODS (containers work natively).
    # Independent of the single-slot strix-runner host lane (which long GraphFusion
    # jobs block). The host-lane variant needs no container:; this one uses the
    # official SDK image so the build env is clean and reproducible.
    runs-on: ci-k8s
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SDK sanity
        run: dotnet --version

      - name: Restore
        run: dotnet restore

      - name: Build (warnaserror)
        run: dotnet build -warnaserror --no-restore

      - name: Test (with coverage)
        run: |
          dotnet test --no-build --verbosity minimal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.4 || true
          REPORTGEN="$HOME/.dotnet/tools/reportgenerator"
          if [ -x "$REPORTGEN" ]; then
            "$REPORTGEN" -reports:"TestResults/**/coverage.cobertura.xml" \
              -targetdir:cover-report -reporttypes:TextSummary
            echo "=== LINE/BRANCH COVERAGE ==="
            grep -E "Line coverage|Branch coverage|Method coverage" cover-report/Summary.txt || true
          else
            python3 - <<'EOF'
            import glob, xml.etree.ElementTree as ET
            for f in glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True):
                r = ET.parse(f).getroot()
                lr, br = r.get("line-rate"), r.get("branch-rate")
                print(f"coverage: line {float(lr)*100:.1f}% branch {float(br)*100:.1f}% ({f})")
            EOF
          fi

      - name: Clean-architecture gate (Atlas)
        run: |
          # atlas binary is host-only (285MB) — not present in the SDK container.
          # Loud skip (never silently green); gate runs parent-side on every PR.
          if ! command -v atlas >/dev/null 2>&1 && [ ! -x "$HOME/.local/bin/atlas" ]; then
            echo "::warning::atlas not present in CI container — arch-gate SKIPPED here; enforced parent-side per-PR"
            exit 0
          fi
          ./scripts/arch-gate.sh
