name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # k8s lane: the ci-k8s runner label is registered HOST-mode
    # (runner-config ConfigMap: `ci-k8s:host`) — steps run directly in the
    # runner pod, and a `container:` key is fatal there: the host executor
    # tries to start the job container via docker.sock, which the pod does
    # not have (runs #50-54 all died at Checkout exactly this way, incl. on
    # main). SDK comes from setup-dotnet per-run instead (same pattern as
    # the working aliestax setup-node lane; egress + runner cache OK).
    runs-on: ci-k8s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libicu (runner image lacks it; dotnet FailFasts without)
        run: dnf install -y libicu >/dev/null 2>&1 || dnf install -y libicu-*

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: SDK sanity
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet --version

      - name: Restore
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet restore

      - name: Build (warnaserror)
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          # Cap MSBuild worker nodes: on the loaded shared runner the node
          # allocator can OOM (MSB1025 'Cannot acquire required number of
          # nodes' + OutOfMemoryException, run 34257) — 4 nodes is plenty
          # for this solution and leaves headroom for the test step.
          # UseSharedCompilation=false kills the lingering Roslyn server (~1G+ per host).
          dotnet build -warnaserror --no-restore -m:4 -nr:false -p:UseSharedCompilation=false

      - name: Test (with coverage)
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          # Sequential per-project runs: parallel unit+E2E test hosts OOM'd
          # the runner pod (run 34286, vstest OutOfMemoryException in
          # Thread.StartCore). Serial halves peak memory.
          # Coverage policy: PR runs only (merge gate); plain push-to-main
          # runs skip coverlet instrumentation — lower heap, faster hosts.
          # NOTE: coverage arg can NOT go through an unquoted $COV variable —
          # bash word-splitting shreds the embedded quotes (measured: MSB1008,
          # run 115). Full command per branch instead.
          if [ "${{ gitea.event_name }}" = "pull_request" ]; then
            dotnet test tests/AgentFolio.UnitTests --no-build --verbosity minimal --collect:"XPlat Code Coverage" --results-directory ./TestResults
            dotnet test tests/AgentFolio.E2E --no-build --verbosity minimal --collect:"XPlat Code Coverage" --results-directory ./TestResults
          else
            dotnet test tests/AgentFolio.UnitTests --no-build --verbosity minimal --results-directory ./TestResults
            dotnet test tests/AgentFolio.E2E --no-build --verbosity minimal --results-directory ./TestResults
          fi

      - name: Coverage summary
        if: always() && gitea.event_name == 'pull_request'
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.4 || true
          REPORTGEN="$HOME/.dotnet/tools/reportgenerator"
          if [ -x "$REPORTGEN" ]; then
            "$REPORTGEN" -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:cover-report -reporttypes:TextSummary
            echo "=== LINE/BRANCH COVERAGE ==="
            grep -E "Line coverage|Branch coverage|Method coverage" cover-report/Summary.txt || true
          else
            python3 -c "import glob,xml.etree.ElementTree as ET; [print('coverage: line', round(float(ET.parse(f).getroot().get('line-rate'))*100,1), '% branch', round(float(ET.parse(f).getroot().get('branch-rate'))*100,1), '%', f) for f in glob.glob('TestResults/**/coverage.cobertura.xml', recursive=True)]"
          fi

      - name: Clean-architecture gate (Atlas)
        run: |
          # atlas binary is host-only (285MB) — not present in the SDK container.
          # Loud skip (never silently green); gate runs parent-side on every PR.
          if ! command -v atlas >/dev/null 2>&1 && [ ! -x "$HOME/.local/bin/atlas" ]; then
            echo "::warning::atlas not present in CI container — arch-gate SKIPPED here; enforced parent-side per-PR"
            exit 0
          fi
          ./scripts/arch-gate.sh

  # Browser-E2E: the shipped bundle in the shipping engine (Chromium). Catches
  # the env-parity class (Illegal-invocation #58, share-401 #59) that in-proc
  # tests cannot see. Journey = unlock -> real docx upload -> cited streamed
  # answer -> zero window page errors (tests/browser/run_journey.py).
  # PR-only: main pushes are covered by merge-gate PR runs; keeps main fast.
  browser-e2e:
    if: gitea.event_name == 'pull_request'
    runs-on: ci-k8s
    # HOST-mode lane (see build-test comment): a container: key is fatal here.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libicu (runner image lacks it; dotnet FailFasts without)
        run: dnf install -y libicu >/dev/null 2>&1 || dnf install -y libicu-*

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Playwright + Chromium + browser libs
        timeout-minutes: 10
        run: |
          # Chromium's runtime libs. VERIFIED Fedora package names (rpm -q on the
          # host): nspr provides libnspr4.so (run 38169/38318 failure); the
          # previous list's `at-spi2-atp` and `libgbm` are NOT Fedora names
          # (at-spi2-core and mesa-libgbm are) and one unknown name fails the
          # whole dnf transaction — which the old >/dev/null||true silenced.
          dnf install -y nss nspr atk at-spi2-atk at-spi2-core cups-libs libdrm libxkbcommon libXcomposite libXdamage libXfixes libXrandr mesa-libgbm pango cairo alsa-lib libxshmfence libX11 libxcb libXcursor libXi || true
          python3 -m pip install --user playwright argon2-cffi
          python3 -m playwright install chromium
          # NO `playwright install-deps`: on this Fedora runner it detects an
          # unsupported OS, falls back to ubuntu24.04 and shells out to apt-get
          # (absent) -> exit 127 (measured run 37977).

      - name: Browser journey (unlock -> docx upload -> cited answer, zero page errors)
        timeout-minutes: 15
        run: |
          # setup-dotnet installs to /usr/share/dotnet on this runner (NOT
          # $HOME/.dotnet) and prepends it to PATH — plain `dotnet` resolves.
          # Do NOT export DOTNET=<homedir path>: the journey would Popen a
          # nonexistent binary (measured run 38036, FileNotFoundError).
          python3 tests/browser/run_journey.py

# 2026-09-18 relesson (af-03 follow-up): a container:-key workflow (runs 31518/31519) is fatal on
# the strix-host systemd runner too — it has no docker.sock either (docker inactive). The SDK the
# container image would provide comes from setup-dotnet (10.0.x) instead; same major version.
