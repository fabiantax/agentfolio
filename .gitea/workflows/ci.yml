name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ci-k8s
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore

      - name: Build (warnaserror)
        run: dotnet build -warnaserror --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity minimal
