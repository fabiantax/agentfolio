name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Host lane (label-wedge fix): strix-main is a HOST runner (no docker socket) —
    # container: jobs wedge forever on it. Run with the host's dotnet SDK instead.
    runs-on: strix-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SDK sanity
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet --version

      - name: Restore
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet restore

      - name: Build (warnaserror)
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet build -warnaserror --no-restore
          echo "BUILD_RC=$?"

      - name: Test
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet test --no-build --verbosity minimal
          echo "TEST_RC=$?"

      - name: Clean-architecture gate (Atlas, host binary)
        run: |
          # Host atlas at ~/.local/bin/atlas (285MB, not fetchable in CI) — skip loudly, never silently
          if [ ! -x "$HOME/.local/bin/atlas" ]; then
            echo "::warning::atlas binary not present on runner — arch-gate SKIPPED (gate runs parent-side + nightly)"
            exit 0
          fi
          rm -rf $(find . -type d \( -name bin -o -name obj \) 2>/dev/null) 2>/dev/null || true
          ./scripts/arch-gate.sh
          echo "GATE_RC=$?"
